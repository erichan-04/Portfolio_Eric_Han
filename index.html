<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eric Han — Portfolio</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      header { padding: 24px 16px; max-width: 1100px; margin: 0 auto; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      .sub { opacity: .8; margin: 0 0 16px; }
      .btns { display:flex; gap:10px; flex-wrap:wrap; }
      a.btn {
        display:inline-block; padding:10px 14px; border-radius:10px;
        border:1px solid rgba(127,127,127,.4); text-decoration:none;
      }
      main { max-width: 1100px; margin: 0 auto; padding: 0 16px 24px; }
      .pdfwrap { border:1px solid rgba(127,127,127,.35); border-radius: 14px; overflow:hidden; }
      iframe { width:100%; height: 85vh; border:0; background: #111; }
      footer { max-width: 1100px; margin: 0 auto; padding: 10px 16px 24px; opacity: .7; font-size: 14px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Eric Han</h1>
      <p class="sub">Mechanical / Aerospace Engineering — Project Portfolio</p>
      <div class="btns">
        <a class="btn" href="./Han_Eric_Portfolio.pdf" download>Download PDF</a>
        <!-- Optional: add your LinkedIn/GitHub -->
        <!-- <a class="btn" href="https://www.linkedin.com/in/yourname/" target="_blank" rel="noreferrer">LinkedIn</a> -->
      </div>
    </header>

    <main>
      <div class="pdfwrap">
        <iframe src="./Han_Eric_Portfolio.pdf#view=FitH" title="Portfolio PDF"></iframe>
      </div>
    </main>

    <footer>© <span id="y"></span> Eric Han</footer>
    <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
  </body>
</html>
